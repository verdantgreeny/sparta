<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal test</title>
    <link rel="stylesheet" href="styles.css" type="text/css" />
  </head>

  <body>
    <header>
      <div>
        <h1 id="header-title">MOVIE TIME</h1>
        <h2 id="header-h2">What's your all time favorite movie?</h2>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="#">영화 북마크</a></li>
        <div id="search-div">
          <label for="search-input"></label>
          <input
            type="text"
            id="search-input"
            placeholder="검색어를 입력해주세요."
            style="display: none"
          />
          <button class="search-btn">검색</button>
        </div>
      </ul>
    </nav>

    <main>
      <h1 id="main-title-text">trending</h1>
      <div id="index-div">
        <article class="movie-card">
          <section
            class="movie-front"
            style="
              background-image: url('https://image.tmdb.org/t/p/w500${poster}');
            "
          >
            <div class="ranking">${i + 1}위</div>
            <div class="overview">
              ${overview}
              <!-- 모달 열기 버튼 -->
              <button class="modal-btn">자세히보기</button>
            </div>
          </section>
          <section>
            <div class="movie-title">${title}</div>
            <div class="rating">평점 : ${rating}</div>
            <button class="bookmark">북마크</button>
          </section>
        </article>

        <article class="movie-card">
          <section
            class="movie-front"
            style="
              background-image: url('https://image.tmdb.org/t/p/w500${poster}');
            "
          >
            <div class="ranking">${i + 1}위</div>
            <div class="overview">
              ${overview}
              <!-- 모달 열기 버튼 -->

            </div>
          </section>
          <section>
            <div class="movie-title">${title}</div>
            <div class="rating">평점 : ${rating}</div>
            <button class="bookmark">북마크</button>
          </section>
        </article>
        <article class="movie-card">
          <section
            class="movie-front"
            style="
              background-image: url('https://image.tmdb.org/t/p/w500${poster}');
            "
          >
            <div class="ranking">${i + 1}위</div>
            <div class="overview">
              ${overview}
              <!-- 모달 열기 버튼 -->
              <button class="modal-btn">자세히보기</button>
            </div>
          </section>
          <section>
            <div class="movie-title">${title}</div>
            <div class="rating">평점 : ${rating}</div>
            <button class="bookmark">북마크</button>
          </section>
        </article>
        <article class="movie-card">
          <section
            class="movie-front"
            style="
              background-image: url('https://image.tmdb.org/t/p/w500${poster}');
            "
          >
            <div class="ranking">${i + 1}위</div>
            <div class="overview">
              ${overview}
              <!-- 모달 열기 버튼 -->
              <button class="modal-btn">자세히보기</button>
            </div>
          </section>
          <section>
            <div class="movie-title">${title}</div>
            <div class="rating">평점 : ${rating}</div>
            <button class="bookmark">북마크</button>
          </section>
        </article>
        <!-- 모달 창: hide 클래스로 숨김처리 -->
        <div class="modal hide">
          <div class="modal-content">
            <h2>모달창</h2>
            <p>모달창 내용</p>
            <button class="close-btn">닫기</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>footer 영역</p>
      <p>저작권 정보</p>
    </footer>
    <script type="module" src="src/modal-test.js"></script>
  </body>
</html>
